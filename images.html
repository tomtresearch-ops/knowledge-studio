<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images - Knowledge Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231a1a50'/><text y='55' x='50' font-size='58' text-anchor='middle' font-family='system-ui' fill='white' font-weight='bold'>KS</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 40px; height: 40px;
            background: #8b5cf6; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; color: white;
        }
        .logo-text h1 { font-size: 24px; font-weight: 600; }
        .logo-text p { font-size: 14px; color: #a1a1aa; }

        .nav { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .nav a { color: #fff; text-decoration: none; font-weight: 500; transition: color 0.2s; }
        .nav a:hover { color: #8b5cf6; }
        .nav a.active { color: #8b5cf6; }

        .main { padding: 32px 40px; flex: 1; }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .toolbar h2 { font-size: 22px; font-weight: 600; flex: 1; }

        .toolbar-controls { display: flex; gap: 10px; align-items: center; }

        .search-box {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 8px 14px;
            color: #fff;
            font-size: 14px;
            width: 220px;
            outline: none;
        }
        .search-box:focus { border-color: #8b5cf6; }
        .search-box::placeholder { color: #666; }

        .filter-btn {
            background: rgba(139,92,246,0.12);
            border: 1px solid rgba(139,92,246,0.25);
            border-radius: 8px;
            padding: 8px 14px;
            color: #c4b5fd;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(139,92,246,0.3);
            border-color: #8b5cf6;
            color: #fff;
        }

        .count-badge {
            background: rgba(139,92,246,0.2);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 13px;
            color: #c4b5fd;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s;
        }
        .card:hover {
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            display: block;
            background: rgba(255,255,255,0.03);
        }
        .card-img-placeholder {
            width: 100%;
            aspect-ratio: 16/10;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: rgba(255,255,255,0.15);
        }

        .card-body { padding: 14px; }

        .card-type {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .type-social_post   { background: rgba(59,130,246,0.2);  color: #93c5fd; }
        .type-whiteboard    { background: rgba(16,185,129,0.2);  color: #6ee7b7; }
        .type-chart         { background: rgba(245,158,11,0.2);  color: #fcd34d; }
        .type-screenshot    { background: rgba(139,92,246,0.2);  color: #c4b5fd; }
        .type-document      { background: rgba(239,68,68,0.2);   color: #fca5a5; }
        .type-other         { background: rgba(255,255,255,0.1); color: #d1d5db; }

        .card-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            color: #e5e7eb;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-date {
            font-size: 12px;
            color: #6b7280;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            width: 32px; height: 32px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: rgba(255,255,255,0.2); }

        .modal img {
            width: 100%;
            border-radius: 12px 12px 0 0;
            display: block;
        }

        .modal-body { padding: 24px; }
        .modal-type { margin-bottom: 10px; }
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; }

        .modal-summary {
            background: rgba(255,255,255,0.05);
            border-left: 3px solid #8b5cf6;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            line-height: 1.7;
            color: #d1d5db;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }

        .modal-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag {
            background: rgba(139,92,246,0.15);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 12px;
            color: #c4b5fd;
        }

        .modal-meta { font-size: 13px; color: #6b7280; }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #6b7280;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 16px; }

        .loading { text-align: center; padding: 60px; color: #6b7280; font-size: 16px; }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon">KS</div>
        <div class="logo-text">
            <h1>Knowledge Studio</h1>
            <p>Visual Intelligence</p>
        </div>
    </div>
    <nav class="nav">
        <a href="/">Capture</a>
        <a href="/library">Library</a>
        <a href="/library/images" class="active">Images</a>
        <a href="/channels">Channels</a>
        <a href="/briefing">Briefing Room</a>
        <a href="/intelligence">Intelligence</a>
        <a href="/stats">Stats</a>
        <a href="/studio">Studio</a>
            <a href="/library/captures">Captures</a>
    </nav>
</header>

<main class="main">
    <div class="toolbar">
        <h2>Images</h2>
        <div class="toolbar-controls">
            <input class="search-box" type="text" id="searchInput" placeholder="Search images…" oninput="filterImages()">
            <span class="count-badge" id="countBadge">—</span>
        </div>
    </div>

    <div id="filterRow" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;"></div>

    <div class="grid" id="grid"></div>
    <div class="loading" id="loading">Loading images…</div>
    <div class="empty-state" id="emptyState" style="display:none;">
        <div class="icon">🖼️</div>
        <p>No images match your filter.</p>
    </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
        <img id="modalImg" src="" alt="" onerror="this.style.display='none'">
        <div class="modal-body">
            <div class="modal-type" id="modalType"></div>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-summary" id="modalSummary" style="display:none;"></div>
            <div class="modal-tags" id="modalTags"></div>
            <div class="modal-meta" id="modalMeta"></div>
        </div>
    </div>
</div>

<script>
let allCaptures = [];
let activeType = null;

const TYPE_ICONS = {
    social_post: '📱',
    whiteboard: '📋',
    chart: '📊',
    screenshot: '🖥️',
    document: '📄',
};

function typeClass(t) {
    const known = ['social_post','whiteboard','chart','screenshot','document'];
    return known.includes(t) ? `type-${t}` : 'type-other';
}

async function load() {
    try {
        const res = await fetch('/api/visual-captures');
        const data = await res.json();
        allCaptures = data.captures || [];
        document.getElementById('loading').style.display = 'none';
        buildFilters();
        render();
    } catch(e) {
        document.getElementById('loading').textContent = 'Failed to load images.';
    }
}

function buildFilters() {
    const types = [...new Set(allCaptures.map(c => c.content_type).filter(Boolean))].sort();
    const row = document.getElementById('filterRow');
    row.innerHTML = '';
    types.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = (TYPE_ICONS[t] || '🖼') + ' ' + t.replace(/_/g,' ');
        btn.dataset.type = t;
        btn.onclick = () => {
            activeType = activeType === t ? null : t;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.type === activeType));
            render();
        };
        row.appendChild(btn);
    });
}

function filterImages() { render(); }

function render() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const grid = document.getElementById('grid');
    const emptyState = document.getElementById('emptyState');

    let filtered = allCaptures;
    if (activeType) filtered = filtered.filter(c => c.content_type === activeType);
    if (q) filtered = filtered.filter(c =>
        (c.title||'').toLowerCase().includes(q) ||
        (c.summary_50||'').toLowerCase().includes(q) ||
        (c.tags||[]).some(t => t.toLowerCase().includes(q))
    );

    document.getElementById('countBadge').textContent = `${filtered.length} image${filtered.length !== 1 ? 's' : ''}`;

    if (!filtered.length) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    emptyState.style.display = 'none';

    grid.innerHTML = filtered.map(c => {
        const imgUrl = `/screenshots/${encodeURIComponent(c.filename)}`;
        const dateStr = c.created_at ? new Date(c.created_at).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';
        const title = (c.title || c.filename).substring(0, 80);
        return `
        <div class="card" onclick="openModal(${c.id})">
            <img class="card-img" src="${imgUrl}" alt="${escHtml(title)}"
                 onerror="this.outerHTML='<div class=\\'card-img-placeholder\\'>${TYPE_ICONS[c.content_type]||'🖼️'}</div>'">
            <div class="card-body">
                <span class="card-type ${typeClass(c.content_type)}">${(c.content_type||'image').replace(/_/g,' ')}</span>
                <div class="card-title">${escHtml(title)}</div>
                <div class="card-date">${dateStr}</div>
            </div>
        </div>`;
    }).join('');
}

function openModal(id) {
    const c = allCaptures.find(x => x.id === id);
    if (!c) return;

    const imgUrl = `/screenshots/${encodeURIComponent(c.filename)}`;
    document.getElementById('modalImg').src = imgUrl;
    document.getElementById('modalImg').style.display = 'block';

    document.getElementById('modalType').innerHTML = `<span class="card-type ${typeClass(c.content_type)}">${(c.content_type||'image').replace(/_/g,' ')}</span>`;
    document.getElementById('modalTitle').textContent = c.title || c.filename;

    const summaryEl = document.getElementById('modalSummary');
    if (c.summary_50) {
        summaryEl.textContent = c.summary_50;
        summaryEl.style.display = 'block';
    } else {
        summaryEl.style.display = 'none';
    }

    const tagsEl = document.getElementById('modalTags');
    tagsEl.innerHTML = (c.tags||[]).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');

    const dateStr = c.created_at ? new Date(c.created_at).toLocaleString() : '';
    document.getElementById('modalMeta').textContent = dateStr ? `Captured ${dateStr}` : '';

    document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
    document.getElementById('modalOverlay').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>

<script id="ks-nav-drag">
(function() {
  const nav = document.querySelector('nav.nav');
  if (!nav) return;
  const ORDER_KEY = 'ks_nav_order';

  function links() { return [...nav.querySelectorAll('a[href]')]; }

  function saveOrder() {
    localStorage.setItem(ORDER_KEY, JSON.stringify(links().map(a => a.getAttribute('href'))));
  }

  function applyOrder() {
    const saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
    if (!saved || !saved.length) return;
    const map = Object.fromEntries(links().map(a => [a.getAttribute('href'), a]));
    const ordered = saved.filter(h => map[h]).map(h => map[h]);
    const extras  = links().filter(a => !saved.includes(a.getAttribute('href')));
    const anchor  = nav.querySelector(':not(a)'); // non-link children (buttons etc)
    [...ordered, ...extras].forEach(a => anchor ? nav.insertBefore(a, anchor) : nav.appendChild(a));
  }

  let dragging = null, ghost = null;

  function init() {
    links().forEach(a => {
      a.draggable = true;
      a.style.cursor = 'grab';
      a.addEventListener('dragstart', e => {
        dragging = a;
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => a.classList.add('ks-dragging'), 0);
      });
      a.addEventListener('dragend', () => {
        a.classList.remove('ks-dragging');
        links().forEach(l => l.classList.remove('ks-drag-over'));
        dragging = null;
        saveOrder();
      });
      a.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragging || dragging === a) return;
        links().forEach(l => l.classList.remove('ks-drag-over'));
        a.classList.add('ks-drag-over');
        const mid = a.getBoundingClientRect().left + a.getBoundingClientRect().width / 2;
        const ref = e.clientX < mid ? a : a.nextElementSibling;
        nav.insertBefore(dragging, ref);
      });
      a.addEventListener('dragleave', () => a.classList.remove('ks-drag-over'));
      a.addEventListener('drop', e => { e.preventDefault(); a.classList.remove('ks-drag-over'); });
    });
  }

  applyOrder();
  init();
})();
</script>
<style>
nav.nav a[draggable] { user-select: none; }
nav.nav a.ks-dragging { opacity: 0.35; }
nav.nav a.ks-drag-over { outline: 1px dashed #8b5cf6; border-radius: 4px; }
</style>

</body>
</html>
